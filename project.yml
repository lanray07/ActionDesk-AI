name: ActionDeskAI
options:
  bundleIdPrefix: com.actiondesk
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ActionDeskAI:
    type: application
    platform: iOS
    sources:
      - path: ActionDeskAI
        excludes:
          - Resources/Info.plist
          - Resources/ActionDeskAI.entitlements
          - Resources/Localizable.xcstrings
          - Resources/PrivacyInfo.xcprivacy
    resources:
      - path: ActionDeskAI/Resources/Localizable.xcstrings
      - path: ActionDeskAI/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.actiondesk.lifeadmin
        INFOPLIST_FILE: ActionDeskAI/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ActionDeskAI/Resources/ActionDeskAI.entitlements
        PRODUCT_NAME: ActionDesk AI
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - ActionDeskAITests
  ActionDeskAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ActionDeskAITests
    dependencies:
      - target: ActionDeskAI


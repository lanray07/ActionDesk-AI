name: Upload iOS Build to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    environment: app-store-connect
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate required secrets
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID API_KEY_ID API_ISSUER_ID API_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then echo "::error::$name is missing"; exit 1; fi
          done

      - name: Prepare App Store Connect key
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          if [[ "$API_PRIVATE_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$API_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Verify App Store Connect app record
        id: app-record
        run: |
          set -euo pipefail
          TOKEN=$(ruby Scripts/app_store_connect_token.rb "$API_KEY_ID" "$API_ISSUER_ID" "$API_KEY_PATH")
          echo "::add-mask::$TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            'https://api.appstoreconnect.apple.com/v1/apps?limit=200' \
            > "$RUNNER_TEMP/apps.json"
          python3 Scripts/verify_app_store_app.py "$RUNNER_TEMP/apps.json" 'com.ActionDeskAI.app'

      - name: Create unsigned release archive
        run: |
          set -o pipefail
          xcodebuild \
            -project ActionDeskAI.xcodeproj \
            -scheme ActionDeskAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ActionDeskAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive | tee "$RUNNER_TEMP/archive.log"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ActionDeskAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" | tee "$RUNNER_TEMP/export.log"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-upload-diagnostics
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/ActionDeskAI.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 7

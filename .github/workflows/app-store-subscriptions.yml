name: Configure App Store Subscriptions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-subscriptions
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store-connect
    env:
      API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate and prepare App Store Connect key
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in API_KEY_ID API_ISSUER_ID API_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then echo "::error::$name is missing"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          if [[ "$API_PRIVATE_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$API_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create subscription group and products
        run: |
          set -euo pipefail
          TOKEN=$(ruby Scripts/app_store_connect_token.rb "$API_KEY_ID" "$API_ISSUER_ID" "$API_KEY_PATH")
          echo "::add-mask::$TOKEN"
          APP_STORE_CONNECT_TOKEN="$TOKEN" python3 Scripts/configure_app_store_subscriptions.py
